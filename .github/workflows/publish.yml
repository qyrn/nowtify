name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only check the Chrome Web Store credentials, upload nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  chrome-web-store:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check that the release tag matches the version
        if: github.event_name == 'release'
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm zip
      - name: Upload and submit for review
        run: pnpm wxt submit --chrome-zip .output/*-chrome.zip ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: emjhkfephckipmmlecbkmpjphfjalkhg
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
