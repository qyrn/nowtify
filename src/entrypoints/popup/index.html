<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nowtify</title>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <defs>
        <radialGradient id="logoCap" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#f48a63" />
          <stop offset="1" stop-color="#d4471f" />
        </radialGradient>
      </defs>
      <symbol id="logo" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="31" class="logo-rim" />
        <circle cx="32" cy="32" r="28" class="logo-bezel" />
        <circle cx="32" cy="32" r="19" fill="url(#logoCap)" />
        <circle cx="26.5" cy="25.5" r="5" fill="#fff" opacity="0.32" />
      </symbol>
    </svg>

    <div class="popup">
      <header class="header">
        <svg class="header-logo" aria-hidden="true"><use href="#logo" /></svg>
        <h1 class="wordmark">Nowtify</h1>
        <span class="live-led hidden" id="liveLed"><i></i><span id="liveLedText"></span></span>
        <button type="button" class="settings-btn" id="settingsBtn" data-i18n-title="settingsTitle">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </header>

      <div class="auth-banner hidden" id="authBanner" role="alert">
        <span class="auth-banner-text" id="authBannerText"></span>
        <button type="button" class="auth-banner-btn" id="authBannerBtn" data-i18n="connectButton"></button>
      </div>

      <form class="add-form" id="addForm" autocomplete="off">
        <input
          type="text"
          class="add-input"
          id="addInput"
          maxlength="80"
          spellcheck="false"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="suggestions"
          data-i18n-placeholder="searchPlaceholder"
        />
        <button type="submit" class="add-btn" id="addBtn" data-i18n-title="addButton">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M12 6v12M6 12h12" />
          </svg>
        </button>
        <div class="suggestions hidden" id="suggestions" role="listbox"></div>
      </form>

      <div class="toolbar hidden" id="toolbar">
        <span class="followed-count" id="followedCount"></span>
        <div class="team-filter hidden" id="teamFilter">
          <button
            type="button"
            class="team-filter-btn"
            id="teamFilterBtn"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span id="teamFilterLabel" data-i18n="allTeams"></span>
            <svg
              class="icon chevron"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <div class="team-filter-menu hidden" id="teamFilterMenu" role="listbox"></div>
        </div>
      </div>

      <div class="streamer-list" id="streamerList"></div>

      <div class="empty-state hidden" id="emptyState">
        <svg class="empty-logo" aria-hidden="true"><use href="#logo" /></svg>
        <p class="empty-title" data-i18n="emptyStateTitle"></p>
        <p class="empty-text" data-i18n="emptyStateText"></p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
